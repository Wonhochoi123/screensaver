# =============================================================================
#  Screensaver-App — central configuration  (single source of truth).
#
#  Every script sources this file, so editing a value here applies everywhere.
#  Paths keep their $HOME / $VAR references instead of resolved absolute paths,
#  which keeps the file portable across machines — they resolve top-down when
#  sourced, so keep each entry AFTER the ones it references.
#
#  This file lives in the repo at config/screensaver.conf and installs to
#  ~/Screensaver-App/config/screensaver.conf. Edit either copy:
#    * the installed copy changes your running setup immediately;
#    * the repo copy is what a fresh install.sh lays down.
# =============================================================================

# --- Paths (portable references; resolved when sourced) ----------------------
export APP_DIR="$HOME/Screensaver-App"
export DATA_DIR="$APP_DIR/Data"
export CFG_DIR="$APP_DIR/config"
export BASE_DIR="$HOME/Pictures/Screensavers"
export MEDIA_DIR="$DATA_DIR/Media"
export MUSIC_DIR="$DATA_DIR/Music"
export RES_DIR="$DATA_DIR/HudResources"   # generated HUD assets: minimaps, QR, geo DB, thumbs
export OPT_DIR="$DATA_DIR/Optimized_Vids"
export TITLE_DIR="$DATA_DIR/TitleCards"
export PLAYLIST_DIR="$DATA_DIR/Playlist"
export PLAYLIST="$PLAYLIST_DIR/playlist.m3u"
export POLICE="$APP_DIR/xmp-police.sh"
export FONT_DIR="$DATA_DIR/Fonts"
export AUDIO_SOCK="/tmp/ss_audio.sock"

# --- Playback / behaviour tunables -------------------------------------------
export PHOTO_DURATION=7        # seconds each still photo is shown (videos play in full)
export VOLUME=70               # mpv startup volume (0-100)
export IDLE_TIMEOUT_MS=300000  # idle ms before the screensaver auto-launches (= 5 min)
export MIN_LOAD_SECS=2         # minimum seconds the "please wait" screen stays visible
export VID_RESCAN_SECS=300     # how often vid-daemon rescans Media/ for new videos

# --- HUD text sizes ----------------------------------------------------------
# Each is a fraction of the screen HEIGHT, so they stay the same visual size on
# any display. e.g. 0.030 ≈ 3% of the screen height. Raise to enlarge.
export HUD_MUSIC_FS=0.020      # now-playing music info (top-left marquee)
export HUD_DATE_FS=0.020       # date (top-right, upper line)
export HUD_REGION_FS=0.020     # region — state / country (top-right, lower line)
export HUD_CITY_FS=0.066       # city name headline (bottom-center)
export HUD_COORD_FS=0.025      # GPS coordinates (under the QR + minimap)
# Text shadow blur/spread (× font size). Bigger = softer, wider dark halo.
export HUD_TEXT_BLUR=0.10
# Text shadow strength (× font size): the dark halo's weight. Smaller = fainter.
export HUD_TEXT_GLOW=0.002

# --- HUD layout --------------------------------------------------------------
# Now-playing marquee width as a fraction of screen width (0.0–1.0). Bigger =
# more of the song title/artist shown at once before it has to scroll.
export MUSIC_WIN_FRAC=0.2
# Minimap + QR square size as a fraction of screen height.
export HUD_MAP_FRAC=0.27
# Album-art thumbnail left of the music marquee: shows the song's embedded
# cover (grayscale while paused), sized to match the music text+bar group, and
# pauses/plays the music when clicked. Set to 0 to hide it.
export HUD_THUMB=1
# Now-playing marquee scroll: speed (px/frame × font size) and the pause (frames)
# held at each end before it reverses.
export MUSIC_SCROLL_SPEED=0.045
export MUSIC_SCROLL_DWELL=30
# Minimap zoom levels (space-separated) and the GPS ring colours per level.
export HUD_MAP_ZOOMS="11 14 16"
export HUD_RING_COLORS="#FFFFFF #B3E5FC #4FC3F7"

# --- Music quiet hours -------------------------------------------------------
# Pause the music during these hours, then resume after — 24h "HH:MM" (a bare
# hour like 22 also works). Leave BOTH empty to disable. Overnight windows are
# fine, e.g. START=22:00 END=07:00.
export MUSIC_SLEEP_START=""
export MUSIC_SLEEP_END=""

# --- Offline place-name resolution (GeoNames) --------------------------------
# Resolves the nearby landmark + city/state/country entirely offline from a
# local SQLite built once by config/build-geodb.sh. No API key, no network at
# runtime. GEONAMES_COUNTRIES is a space-separated list of ISO country codes to
# index (small, fast); leave it EMPTY to index the whole planet (~390MB
# download, larger DB). Data © GeoNames, CC-BY 4.0 (https://www.geonames.org).
export GEONAMES_COUNTRIES=''
export GEODB="$RES_DIR/geo/geonames.sqlite"
# Bump GEODB_VERSION whenever the DB's contents change (country set or the
# landmark feature-code table) to force a one-time rebuild on next launch.
export GEODB_VERSION='6'
